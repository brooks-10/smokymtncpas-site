.wordmark{

  letter-spacing:-.01em;text-align:center;line-height:1.05;
  font-variation-settings:"opsz" 60;
}
.wordmark em{font-style:italic;color:#C4622D;}
.tagline{
  margin-top:18px;font-family:"Schibsted Grotesk",sans-serif;font-weight:600;font-size:20px;
